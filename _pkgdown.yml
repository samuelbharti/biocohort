url: http://www.samuelbharti.com/myceliumr/
template:
  bootstrap: 5
  bootswatch: flatly
home:
  title: myceliumr
  description: Cross-species cohort framework for rat/mouse/human analysis
navbar:
  structure:
    left:
    - home
    - intro
    - reference
    - articles
    - news
    right: github
  components:
    home:
      icon: fa-home
      href: index.html
      aria-label: Home
    reference:
      text: Reference
      href: reference/index.html
    github:
      icon: fab fa-github fa-lg
      href: https://github.com/samuelbharti/myceliumr
      aria-label: GitHub
articles:
- title: Reference
  contents:
  - starts_with("glossary")
  - starts_with("naming")
reference:
- title: Package
  desc: Package overview and entry point
  contents:
  - myceliumr-package
- title: Core Classes
  desc: S7 classes for study data structures
  contents:
  - Study
  - Subject
  - Cohort
  - AnalysisSpec
  - example_cohort
- title: Constructors
  desc: Create and validate objects
  contents:
  - study_new
  - subject_new
  - cohort_new
  - analysis_spec_new
- title: IO Functions
  desc: Read and write data
  contents: read_manifest_csv
- title: Analysis Registry
  desc: Register and list analyses
  contents:
  - analysis_register
  - analysis_list
  - analysis_spec
- title: Validation
  desc: Data validation functions
  contents:
  - validate_manifest
  - validate_cohort
- title: Samples
  desc: Work with the sample map
  contents:
  - sample_pairs
- title: Cross-species translation
  desc: Translate features across assemblies and species (experimental)
  contents:
  - orthologize
  - liftover_intervals
  - liftover_vcf
  - liftover_rtracklayer
  - liftover_crossmap
  - register_liftover_backend
  - liftover_backends
  - TranslationResult
  - translation_stats

