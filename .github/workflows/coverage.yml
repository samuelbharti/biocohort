name: coverage

# Test coverage as a signal while the API is still settling, not a gate. No
# third-party upload and no token: the percentage goes to the job summary.
on:
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: coverage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coverage:
    runs-on: ubuntu-latest
    name: coverage
    timeout-minutes: 30
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::covr
          needs: coverage
          working-directory: pkg-r

      - name: Measure coverage
        run: |
          cov <- covr::package_coverage("pkg-r")
          print(cov)
          pct <- sprintf("%.2f", covr::percent_coverage(cov))
          writeLines(paste0("### Test coverage: ", pct, "%"), Sys.getenv("GITHUB_STEP_SUMMARY"))
        shell: Rscript {0}
